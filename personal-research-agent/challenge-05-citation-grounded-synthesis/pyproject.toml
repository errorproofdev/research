[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-agent-grounded-synthesis"
version = "0.5.0"
description = "Fail-closed citation-grounded synthesis for a personal research agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

