[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-agent-rag-redteam"
version = "0.6.0"
description = "Adversarial evidence gateway and RAG regression harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.4,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

