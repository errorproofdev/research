[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-agent-capability-mcp"
version = "0.9.0"
description = "Stateless capability-scoped MCP boundary with one-time approvals"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[project.scripts]
research-agent-mcp = "research_agent_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
